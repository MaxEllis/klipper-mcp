[project]
name = "klipper-mcp"
version = "0.1.0"
description = "Watch and drive a Klipper 3D printer through Moonraker from Claude or any MCP client, and remember how every print actually turned out"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Max Ellis" }]
requires-python = ">=3.11"
keywords = ["mcp", "klipper", "moonraker", "3d-printing", "claude", "model-context-protocol"]
dependencies = ["mcp>=2.2,<3", "httpx>=0.27", "websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
klipper-mcp = "klipper_mcp.server:main"
klipper-mcp-capture = "klipper_mcp.capture:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klipper_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
